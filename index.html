<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS OF WEALTH</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div class="max-w-md mx-auto p-4 space-y-3">
<h1 class="text-center text-yellow-400 font-bold">CEDARS OF WEALTH</h1>
<p class="text-center text-[10px] text-green-400">*384*CEDARS# | 70/30 | USDT ONLY</p>

<form class="border border-green-600 p-3 rounded"><select class="w-full p-2 bg-black border rounded text-sm"><option>$300</option><option>$1000</option><option>$5000</option><option>$10000</option><option>$50000</option><option>$100000</option></select><input class="w-full mt-2 p-2 bg-black border rounded text-sm" placeholder="USDT Address"><button class="w-full mt-2 bg-green-600 p-2 rounded text-sm">DEPOSIT</button></form>

<form class="border border-yellow-600 p-3 rounded"><p id="t" class="text-xs text-green-400"></p><label class="text-xs"><input type="checkbox" class="mt-2"> Task Done 60s</label><button class="w-full mt-2 bg-yellow-600 p-2 rounded text-sm">UNLOCK 2%</button></form>

<form class="border border-white/20 p-3 rounded"><input class="w-full p-2 bg-black border rounded text-sm" placeholder="Withdraw Amount"><input class="w-full mt-2 p-2 bg-black border rounded text-sm" placeholder="USDT Address"><button class="w-full mt-2 bg-white text-black p-2 rounded text-sm">WITHDRAW</button></form>

<form class="border border-white/20 p-3 rounded"><input class="w-full p-2 bg-black border rounded text-sm" placeholder="Email"><input class="w-full mt-2 p-2 bg-black border rounded text-sm" placeholder="Password"><button class="w-full mt-2 border p-2 rounded text-sm">LOGIN - CLOCK IN</button></form>

<form class="border border-white/20 p-3 rounded"><input class="w-full p-2 bg-black border rounded text-sm" placeholder="Referral Code"><button class="w-full mt-2 border border-green-600 p-2 rounded text-sm">ACTIVATE 10%/5%/1%</button></form>
</div>
<script>const a=["Handshake","Compliment","Silly Face","Dream","High-Five","Dance","Hug"];document.getElementById('t').innerText=a[new Date().getDay()];</script>
</body>
</html>
